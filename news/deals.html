<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal iOS — Tổng hợp</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../main.css" />
  <style>
    .deal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .deal-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition:
        transform 0.2s,
        outline 0.2s;
      position: relative;
    }

    .deal-card:hover {
      transform: translateY(-2px);
    }

    .deal-card.in-cart {
      outline: 2px solid rgba(61, 220, 132, 0.45);
    }

    .deal-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 600;
      color: var(--text);
    }

    .deal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 12px;
      color: var(--muted);
      align-items: center;
    }

    .deal-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .deal-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--tag-text);
    }

    .deal-badge.free {
      background: rgba(61, 220, 132, 0.18);
      border-color: rgba(61, 220, 132, 0.35);
      color: var(--tag-text);
    }

    .deal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .deal-actions button {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      transition:
        background 0.2s,
        border-color 0.2s;
    }

    .deal-actions button:hover {
      background: var(--hover);
    }

    .deal-actions .deal-link-btn {
      border-color: rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.1);
    }

    .deal-actions .store-btn {
      border-color: rgba(61, 220, 132, 0.45);
      background: rgba(61, 220, 132, 0.1);
    }

    .deal-actions .store-btn.store-apple {
      border-color: rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.1);
    }

    .deal-actions .store-btn.store-google {
      border-color: rgba(61, 220, 132, 0.45);
      background: rgba(61, 220, 132, 0.1);
    }

    .deal-actions .store-btn.store-redeem {
      border-color: rgba(168, 85, 247, 0.45);
      background: rgba(168, 85, 247, 0.1);
    }

    .deal-actions .cart-btn {
      min-width: 40px;
      padding: 8px 10px;
      font-size: 16px;
      line-height: 1;
    }

    .deal-actions .cart-btn.in-cart {
      background: rgba(61, 220, 132, 0.22);
      border-color: rgba(61, 220, 132, 0.5);
    }

    .deals-cart-bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      max-width: 720px;
      margin: 0 auto;
    }

    .deals-cart-bar.show {
      display: flex;
    }

    .deals-cart-bar span {
      font-size: 13px;
      color: var(--muted);
    }

    .deals-cart-bar strong {
      color: var(--text);
    }

    .deals-cart-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .deals-cart-actions button {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--tag-bg);
      color: var(--tag-text);
    }

    .deals-cart-actions .primary {
      background: linear-gradient(135deg, #3ddc84, #2eb872);
      color: #052e16;
      border: none;
    }

    .deals-cart-actions .ghost {
      background: transparent;
      color: var(--muted);
    }

    .deals-cart-actions .primary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .verified-target-select {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 10px;
      cursor: pointer;
    }

    .verified-select-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty-deals {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    /* ===== TABS SYSTEM FOR DEALS & VERIFIED ===== */
    .deals-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 2px;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: -2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ===== VERIFIED CARDS ===== */
    .verified-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .verified-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .verified-card-header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .verified-app-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      object-fit: cover;
      background: #f1f5f9;
      border: 1px solid var(--border);
    }

    .verified-app-info {
      flex: 1;
      min-width: 0;
    }

    .verified-app-title {
      margin: 0 0 6px 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-app-badges {
      display: flex;
      gap: 6px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .platform-badge.ios {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text);
    }

    body.dark .platform-badge.ios {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .platform-badge.android {
      background: rgba(61, 220, 132, 0.15);
      border-color: rgba(61, 220, 132, 0.3);
      color: var(--tag-text);
    }

    .deal-type-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid rgba(61, 220, 132, 0.2);
    }

    .verified-card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      flex-grow: 1;
    }

    .verified-meta-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .verified-meta-item strong {
      color: var(--text);
      font-weight: 500;
    }

    .original-price {
      color: var(--danger);
      font-weight: 600;
      text-decoration: line-through;
    }

    .verified-description-wrap {
      margin-top: 4px;
    }

    .verified-description {
      margin: 4px 0 2px 0;
      line-height: 1.45;
      color: var(--text);
      font-size: 12.5px;
      word-break: break-word;
    }

    .verified-description.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .expand-desc-btn {
      background: none;
      border: none;
      color: var(--button);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-top: 2px;
    }

    .expand-desc-btn:hover {
      text-decoration: underline;
    }

    .verified-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      font-style: italic;
    }

    .verified-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .store-link-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .store-link-btn.apple {
      border: 1px solid rgba(96, 165, 250, 0.45);
      background: rgba(96, 165, 250, 0.1);
      color: #3b82f6;
    }

    .store-link-btn.apple:hover {
      background: rgba(96, 165, 250, 0.2);
    }

    .store-link-btn.google {
      border: 1px solid rgba(61, 220, 132, 0.45);
      background: rgba(61, 220, 132, 0.1);
      color: var(--tag-text);
    }

    .store-link-btn.google:hover {
      background: rgba(61, 220, 132, 0.2);
    }

    .verified-card-actions .delete-btn {
      border-radius: 10px;
      border: 1px solid rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.08);
      color: var(--danger);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .verified-card-actions .delete-btn:hover {
      background: rgba(239, 68, 68, 0.15);
    }
  </style>
</head>

        Tạo bài tổng hợp →
      </button>

        ✍️ Viết deal riêng

  <script>
    const DEALS_BASE_API = "https://deals.mdchannelvn.workers.dev";
    const STORAGE_SOURCES = "techrum_deal_sources";
    const STORAGE_CART = "techrum_deals_cart";
    const IOS_PREFILL_KEY = "techrum_ios_prefill";

    const DEFAULT_SOURCES = [
      {
        id: "seed-mydealz-ios",
        name: "MyDealz — iOS Apps",
        logo: "https://www.mydealz.de/favicon.ico",
        url: "https://www.mydealz.de/rss/gruppe/ios-apps",
      },
    ];

    let sourcesData = [];
    let currentSource = null;
    let currentPage = 1;
    let totalPages = 1;
    let limit = 10;
    let editingId = null;

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const srcName = document.getElementById("srcName");
    const srcLogo = document.getElementById("srcLogo");
    const srcUrl = document.getElementById("srcUrl");
    const dealsGrid = document.getElementById("dealsGrid");
    const pageTitle = document.getElementById("pageTitle");

    function newId() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function readSources() {
      try {
        const raw = localStorage.getItem(STORAGE_SOURCES);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed) && parsed.length) return parsed;
      } catch (_) { }
      return DEFAULT_SOURCES.slice();
    }

    function writeSources(list) {
      localStorage.setItem(STORAGE_SOURCES, JSON.stringify(list));
    }

    function dealKey(d) {
      return [d.appStoreUrl || "", d.dealLink || "", d.appName || ""].join("|");
    }

    function readCart() {
      try {
        const raw = sessionStorage.getItem(STORAGE_CART);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (_) {
        return [];
      }
    }

    function writeCart(list) {
      sessionStorage.setItem(STORAGE_CART, JSON.stringify(list));
    }

    function cartHas(key) {
      return readCart().some((x) => dealKey(x) === key);
    }

    function toggleCart(deal) {
      const key = dealKey(deal);
      let cart = readCart();
      const idx = cart.findIndex((x) => dealKey(x) === key);
      if (idx >= 0) {
        cart.splice(idx, 1);
      } else {
        cart.push({
          appName: deal.appName,
          dealLink: deal.dealLink,
          appStoreUrl: deal.appStoreUrl,
          redeemUrl: deal.redeemUrl,
          originalPrice: deal.originalPrice,
          isFreeCheck: deal.isFreeCheck,
          pubDate: deal.pubDate,
        });
      }
      writeCart(cart);
      updateCartBar();
      document.querySelectorAll(".deal-card").forEach((el) => {
        if (el.dataset.dealKey === key) {
          el.classList.toggle("in-cart", cartHas(key));
          const btn = el.querySelector(".cart-btn");
          if (btn) {
            btn.classList.toggle("in-cart", cartHas(key));
            btn.textContent = cartHas(key) ? "✓" : "+";
            btn.setAttribute(
              "aria-label",
              cartHas(key) ? "Bỏ khỏi giỏ" : "Thêm vào giỏ",
            );
          }
        }
      });
    }

    let selectedApps = [];
    let verifiedAppsData = [];
    let selectedVerifiedIds = new Set();

    function updateBarsPosition() {
      const cart = readCart();
      const cartVisible = cart.length > 0;
      const modVisible = selectedApps.length > 0;

      const cartBar = document.getElementById("cartBar");
      const cartText = document.getElementById("cartBarText");
      const modBar = document.getElementById("modBar");
      const modText = document.getElementById("modBarText");

      if (cartBar && cartText) {
        if (cartVisible) {
          cartBar.classList.add("show");
          cartText.innerHTML = `<strong>${cart.length}</strong> deal trong giỏ — sẵn sàng chuyển sang iOS converter`;
          cartBar.style.bottom = modVisible ? "76px" : "12px";
        } else {
          cartBar.classList.remove("show");
        }
      }

      if (modBar && modText) {
        if (modVisible) {
          modBar.classList.add("show");
          modText.innerHTML = `Đã chọn <strong>${selectedApps.length}</strong> ứng dụng để duyệt`;
          modBar.style.bottom = "12px";
        } else {
          modBar.classList.remove("show");
        }
      }
    }

    function updateCartBar() {
      updateBarsPosition();
    }

    function clearSelectedApps() {
      selectedApps = [];
      document.querySelectorAll('.mod-select-checkbox').forEach(cb => cb.checked = false);
      updateBarsPosition();
    }

    async function saveSelectedApps() {
      if (!selectedApps.length) return;
      
      const count = selectedApps.length;
      if (!confirm(`Lưu ${count} ứng dụng đã chọn vào danh sách Verified?`)) return;

      try {
        const res = await fetch(`${DEALS_BASE_API}/api/verified-apps`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(selectedApps.map(a => {
            const { _key, ...app } = a;
            return app;
          }))
        });

        const data = await res.json();
        if (data.success) {
          alert(`Đã lưu thành công ${data.count} ứng dụng!`);
          clearSelectedApps();
        } else {
          alert("Lỗi khi lưu ứng dụng: " + (data.error || "Không rõ nguyên nhân"));
        }
      } catch (e) {
        console.error(e);
        alert("Không thể kết nối đến server để lưu ứng dụng.");
      }
    }

    function clearCart() {
      if (!readCart().length) return;
      if (!confirm("Xoá toàn bộ deal trong giỏ?")) return;
      writeCart([]);
      updateCartBar();
      loadDeals(false);
    }

    function goToIos() {
      const cart = readCart();
      if (!cart.length) {
        alert("Giỏ đang trống. Hãy bấm + trên từng deal.");
        return;
      }
      const prefill = cart.map((d) => ({
        url: (d.appStoreUrl || "").trim(),
        price:
          d.originalPrice != null && d.originalPrice !== ""
            ? String(d.originalPrice)
            : "",
      }));
      const missing = prefill.filter((p) => !p.url);
      if (missing.length) {
        alert("Một số deal chưa có App Store URL — bỏ chúng hoặc mở deal gốc.");
        return;
      }
      sessionStorage.setItem(IOS_PREFILL_KEY, JSON.stringify(prefill));
      window.location.href = "/news/ios.html";
    }

    function normalizeExternalUrl(url) {
      const cleaned = (url || "").trim();
      if (!cleaned) return "";
      if (/^https?:\/\//i.test(cleaned)) return cleaned;
      if (/^\/\//.test(cleaned)) return "https:" + cleaned;
      if (/^[a-z]+:/i.test(cleaned)) return cleaned;
      return "https://" + cleaned;
    }

    function openExternalLink(url) {
      const safeUrl = normalizeExternalUrl(url);
      if (!safeUrl) return false;
      const popup = window.open(safeUrl, "_blank", "noopener,noreferrer");
      if (popup) return true;
      const a = document.createElement("a");
      a.href = safeUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    }

    function formatPrice(n, isFree) {
      if (isFree) return "Miễn phí";
      if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
      return (
        new Intl.NumberFormat("de-DE", {
          style: "currency",
          currency: "EUR",
          maximumFractionDigits: 2,
        }).format(Number(n)) + " (giá gốc)"
      );
    }

    function formatSource(src) {
      if (!src) return "—";
      const mapping = {
        reddit: "Reddit",
        mydealz: "MyDealz",
        dealabs: "Dealabs",
        newmobilelife: "NewMobileLife"
      };
      return mapping[src.toLowerCase()] || src.charAt(0).toUpperCase() + src.slice(1);
    }

    function formatTime(pubDate) {
      if (!pubDate) return "—";
      const t = new Date(pubDate);
      if (Number.isNaN(t.getTime())) return pubDate;
      return t.toLocaleString("vi-VN", {
        dateStyle: "medium",
        timeStyle: "short",
      });
    }

    function isDealFree(d) {
      return (
        !!d.isFreeCheck ||
        d.originalPrice === 0 ||
        d.originalPrice === "0"
      );
    }

    function getLogoFromUrl(url) {
      try {
        const u = new URL(url);
        return `${u.protocol}//${u.hostname}/favicon.ico`;
      } catch (e) {
        return "";
      }
    }

    function openAdd() {
      editingId = null;
      modalTitle.innerText = "Thêm nguồn deal";
      srcName.value = srcUrl.value = "";
      document.getElementById("srcSkipVerify").checked = false;
      modal.style.display = "flex";
    }

    function openEdit(s) {
      editingId = s.id;
      modalTitle.innerText = "Sửa nguồn deal";
      srcName.value = s.name;
      srcUrl.value = s.url;
      document.getElementById("srcSkipVerify").checked = s.skip_verify === 1;
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    async function saveSource() {
      const name = srcName.value.trim();
      const url = srcUrl.value.trim();
      const skipVerify = document.getElementById("srcSkipVerify").checked ? 1 : 0;

      if (!name || !url) {
        alert("Cần tên và RSS URL.");
        return;
      }

      try {
        if (editingId) {
          const originalSource = sourcesData.find(s => s.id === editingId);
          if (originalSource && originalSource.url !== url) {
            // Delete old source first because URL changed
            await fetch(`${DEALS_BASE_API}/api/sources/delete?id=${editingId}`);
          }
        }

        const res = await fetch(`${DEALS_BASE_API}/api/sources`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, url, skip_verify: skipVerify })
        });
        
        const data = await res.json();
        if (data.success) {
          closeModal();
          loadSources();
        } else {
          alert("Lỗi khi lưu nguồn: " + (data.error || "Không rõ nguyên nhân"));
        }
      } catch (e) {
        console.error(e);
        alert("Không thể kết nối đến server để lưu nguồn.");
      }
    }

    async function deleteSource(id, name) {
      if (!confirm(`Xoá nguồn "${name}"?`)) return;
      try {
        const res = await fetch(`${DEALS_BASE_API}/api/sources/delete?id=${id}`);
        const data = await res.json();
        if (data.deleted) {
          if (currentSource?.id === id) {
            currentSource = null;
            dealsGrid.innerHTML = "";
            pageTitle.innerText = "Chọn nguồn deal";
          }
          loadSources();
        } else {
          alert("Lỗi khi xoá nguồn.");
        }
      } catch (e) {
        console.error(e);
        alert("Không thể kết nối đến server để xoá nguồn.");
      }
    }

    async function loadSources() {
      const box = document.getElementById("sources");
      const loading = document.getElementById("sourcesLoading");
      if (!box) return;

      loading?.classList.add("show");
      box.innerHTML = "";

      try {
        const res = await fetch(`${DEALS_BASE_API}/api/sources`);
        sourcesData = await res.json();
        
        loading?.classList.remove("show");

        if (!Array.isArray(sourcesData) || !sourcesData.length) {
          box.innerHTML = '<p class="empty-deals" style="margin: 10px; font-size:12px;">Chưa có nguồn deal nào.</p>';
          currentSource = null;
          dealsGrid.innerHTML = '<p class="empty-deals">Hãy thêm nguồn deal để bắt đầu.</p>';
          pageTitle.innerText = "Chọn nguồn deal";
          return;
        }

        sourcesData.forEach((s) => {
          const div = document.createElement("div");
          div.className = "source";
          if (currentSource?.id === s.id) div.classList.add("active");

          const left = document.createElement("div");
          left.className = "source-left";
          
          const img = document.createElement("img");
          img.src = getLogoFromUrl(s.url);
          img.alt = "";
          img.loading = "lazy";
          
          const span = document.createElement("span");
          span.textContent = s.name;
          left.appendChild(img);
          left.appendChild(span);

          const actions = document.createElement("div");
          actions.className = "source-actions";

          const editBtn = document.createElement("button");
          editBtn.className = "icon-btn edit";
          editBtn.type = "button";
          editBtn.title = "Sửa";
          editBtn.setAttribute("aria-label", "Sửa");
          editBtn.textContent = "✏️";
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openEdit(s);
          });

          const delBtn = document.createElement("button");
          delBtn.className = "icon-btn delete";
          delBtn.type = "button";
          delBtn.title = "Xoá";
          delBtn.setAttribute("aria-label", "Xoá");
          delBtn.textContent = "🗑️";
          delBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteSource(s.id, s.name);
          });

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          div.appendChild(left);
          div.appendChild(actions);

          div.addEventListener("click", () => selectSource(s));
          box.appendChild(div);
        });

        // Keep active source highlighted if it still exists; otherwise do not auto-select
        if (sourcesData.length) {
          const stillExists = currentSource && sourcesData.some(s => s.id === currentSource.id);
          if (stillExists) {
            const activeIdx = sourcesData.findIndex(s => s.id === currentSource.id);
            if (activeIdx >= 0) {
              const el = box.children[activeIdx];
              if (el) el.classList.add("active");
            }
          } else {
            currentSource = null;
            dealsGrid.innerHTML = '<p class="empty-deals">Vui lòng chọn nguồn deal ở danh sách bên trái để bắt đầu.</p>';
            pageTitle.innerText = "Chọn nguồn deal";
          }
        }
      } catch (e) {
        console.error(e);
        box.innerHTML = '<p class="empty-deals" style="margin: 10px; font-size:12px;">Không tải được nguồn deal.</p>';
        loading?.classList.remove("show");
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function selectSource(source) {
      currentSource = source;
      currentPage = 1;
      pageTitle.innerText = source.name;
      scrollTopMobile();
      document.querySelectorAll(".source").forEach((el) => {
        el.classList.remove("active");
      });
      const idx = sourcesData.findIndex((s) => s.id === source.id);
      document.querySelectorAll(".source")[idx]?.classList.add("active");
      if (window.innerWidth <= 768) closeSidebar();
      loadDeals(false);
    }

    async function loadDeals(append) {
      if (!currentSource) return;
      const loading = document.getElementById("dealsLoading");
      loading?.classList.add("show");
      let data;
      try {
        const u = `${DEALS_BASE_API}/deals?url=${encodeURIComponent(currentSource.url)}&page=${currentPage}&limit=${limit}`;
        const res = await fetch(u);
        data = await res.json();
      } catch (e) {
        console.error(e);
        if (!append) {
          dealsGrid.innerHTML =
            '<p class="empty-deals">Không tải được deal. Kiểm tra mạng hoặc URL RSS.</p>';
        }
        loading?.classList.remove("show");
        return;
      } finally {
        loading?.classList.remove("show");
      }

      const list = Array.isArray(data.deals) ? data.deals : [];
      if (!append) dealsGrid.innerHTML = "";

      if (!append && !list.length) {
        dealsGrid.innerHTML =

      list.forEach((deal) => {

        card.className = "deal-card" + (cartHas(key) ? " in-cart" : "");

        const title = escapeHtml(deal.appName || "(Không tên)");
        const priceLine = formatPrice(deal.originalPrice, free);
        const timeLine = formatTime(deal.pubDate);
        const isSelected = selectedApps.some(a => a._key === key);

        card.innerHTML = `
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
      <h3 class="deal-title" style="margin: 0;">${title}</h3>
      <input type="checkbox" class="mod-select-checkbox" data-key="${key}" style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;" ${isSelected ? 'checked' : ''} />
    </div>
    <div class="deal-meta">
      <span><strong>Giá:</strong> ${escapeHtml(priceLine)}</span>
      <span class="deal-badge ${free ? "free" : ""}">${free ? "Free" : "Có phí"}</span>
      ${deal.alreadyVerified ? `<span class="deal-badge" style="background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.35); color: #a855f7;" title="Đã verify trước đó, dùng lại kết quả có sẵn">✅ Đã Verified</span>` : ''}
      ${deal.source ? `<span><strong>Nguồn:</strong> ${escapeHtml(formatSource(deal.source))}</span>` : ''}
    </div>
    <div class="deal-actions">
      <button type="button" class="deal-link-btn" data-act="deal">Deal gốc</button>
      ${deal.appStoreUrl ? `<button type="button" class="store-btn store-apple" data-act="store">App Store</button>` : ''}
      ${deal.playStoreUrl ? `<button type="button" class="store-btn store-google" data-act="store-play">Google Play</button>` : ''}
      ${deal.redeemUrl ? `<button type="button" class="store-btn store-redeem" data-act="redeem">Redeem</button>` : ''}
      <button type="button" class="cart-btn ${cartHas(key) ? "in-cart" : ""}"
        data-act="cart" aria-label="${cartHas(key) ? "Bỏ khỏi giỏ" : "Thêm vào giỏ"}">${cartHas(key) ? "✓" : "+"}</button>
    </div>`;

        card.querySelector('[data-act="deal"]').onclick = (e) => {
          e.stopPropagation();
          if (!deal.dealLink) {
            alert("Không có link deal.");
            return;
          }
          openExternalLink(deal.dealLink);
        };
        const storeBtn = card.querySelector('[data-act="store"]');
        if (storeBtn) {
          storeBtn.onclick = (e) => {
            e.stopPropagation();
            openExternalLink(deal.appStoreUrl);
          };
        }
        const playBtn = card.querySelector('[data-act="store-play"]');
        if (playBtn) {
          playBtn.onclick = (e) => {
            e.stopPropagation();
            openExternalLink(deal.playStoreUrl);
          };
        }
        const redeemBtn = card.querySelector('[data-act="redeem"]');
        if (redeemBtn) {
          redeemBtn.onclick = (e) => {
            e.stopPropagation();
            openExternalLink(deal.redeemUrl);
          };
        }
        card.querySelector('[data-act="cart"]').onclick = (e) => {
          e.stopPropagation();
          toggleCart(deal);
        };

        const selectCb = card.querySelector('.mod-select-checkbox');
        if (selectCb) {
          selectCb.addEventListener('change', (e) => {
            const checked = e.target.checked;
            if (checked) {
              if (!selectedApps.some(a => a._key === key)) {
                selectedApps.push({
                  platform:       deal.appStoreUrl ? "ios" : "android",
                  appId:          deal.appStoreUrl ? (deal.appStoreUrl.match(/\/id(\d+)/i) || [])[1] : (deal.playStoreUrl.match(/[?&]id=([^&]+)/i) || [])[1],
                  appName:        deal.appName || "",
                  iconUrl:        deal.iconUrl || "",
                  fileSizeBytes:  deal.fileSizeBytes || null,
                  minOsVersion:   deal.minOsVersion || null,
                  description:    deal.description || "",
                  originalPrice:  deal.originalPrice ? String(deal.originalPrice) : null,
                  currentPrice:   0,
                  dealType:       deal.dealType || "1",
                  appStoreUrl:    deal.appStoreUrl || deal.playStoreUrl || null,
                  redeemUrl:      deal.redeemUrl || null,
                  source:         deal.source || "",
                  _key:           key
                });
              }
            } else {
              selectedApps = selectedApps.filter(a => a._key !== key);
            }
            updateBarsPosition();
          });
        }

        card.dataset.dealKey = key;
        dealsGrid.appendChild(card);
      });

      const total = Number(data.total);
      if (Number.isFinite(total) && total > 0) {
        totalPages = Math.max(1, Math.ceil(total / limit));
      } else if (data.hasMore === true) {
        totalPages = Math.max(totalPages, currentPage + 1);
      } else {
        totalPages = currentPage;
      }

      renderPagination();

      const paginationEl = document.getElementById("pagination");
      const loadmoreBtn = document.getElementById("loadmoreBtn");
      if (totalPages > 1) {
        if (paginationEl) paginationEl.style.display = "flex";
        if (loadmoreBtn && loadmoreBtn.parentElement) {
          loadmoreBtn.parentElement.style.display = "flex";
        }
      } else {
        if (paginationEl) paginationEl.style.display = "none";
        if (loadmoreBtn && loadmoreBtn.parentElement) {
          loadmoreBtn.parentElement.style.display = "none";
        }
      }

      updateCartBar();
    }

    function renderPagination() {
      const box = document.getElementById("pagination");
      box.innerHTML = "";

      function createBtn(label, page, disabled, active) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        if (active) btn.classList.add("active");
        if (disabled) btn.classList.add("disabled");
        btn.onclick = () => {
          if (disabled) return;
          currentPage = page;
          scrollTopMobile();
          loadDeals(false);
        };
        box.appendChild(btn);
      }

      createBtn("←", currentPage - 1, currentPage === 1);

      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, currentPage + 2);

      if (start > 1) {
        createBtn("1", 1, false, false);
        if (start > 2) {
          const dots = document.createElement("span");
          dots.textContent = "...";
          box.appendChild(dots);
        }
      }

      for (let i = start; i <= end; i++) {
        createBtn(String(i), i, false, i === currentPage);
      }

      if (end < totalPages) {
        if (end < totalPages - 1) {
          const dots = document.createElement("span");
          dots.textContent = "...";
          box.appendChild(dots);
        }
        createBtn(String(totalPages), totalPages, false, false);
      }

      createBtn("→", currentPage + 1, currentPage === totalPages);
    }

    function loadMore() {
      if (currentPage >= totalPages) return;
      currentPage++;
      loadDeals(true).then(() => {
        scrollToPageStart(currentPage);
      });
    }

    function scrollTopMobile() {
      if (window.innerWidth <= 768) {
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        document.querySelector(".news-content")?.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }
    }

    function scrollToPageStart(page) {
      const items = document.querySelectorAll(".deal-card");
      const index = (page - 1) * limit;
      items[index]?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeSidebar() {
      document.getElementById("newsSidebar").classList.remove("open");
      document.getElementById("sidebarRight").classList.remove("open");
      document.getElementById("overlay").classList.remove("show");
    }

    function toggleRightSidebar() {
      document.getElementById("sidebarRight").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("show");
    }

    // ===== TAB & VERIFIED APPS MANAGEMENT =====
    let activeTab = 'deals';

    async function switchTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;

      const tabDeals = document.getElementById("tabDeals");
      const tabVerified = document.getElementById("tabVerified");
      const dealsGrid = document.getElementById("dealsGrid");
      const verifiedGrid = document.getElementById("verifiedGrid");
      const pagination = document.getElementById("pagination");
      const loadmoreBtn = document.getElementById("loadmoreBtn");
      const newsSidebar = document.getElementById("newsSidebar");
      const menuBtn = document.getElementById("menuBtn");

      if (tab === 'deals') {
        tabDeals.classList.add("active");
        tabVerified.classList.remove("active");

        dealsGrid.style.display = "grid";
        if (currentSource && totalPages > 1) {
          pagination.style.display = "flex";
          if (loadmoreBtn && loadmoreBtn.parentElement) {
            loadmoreBtn.parentElement.style.display = "flex";
          }
        } else {
          pagination.style.display = "none";
          if (loadmoreBtn && loadmoreBtn.parentElement) {
            loadmoreBtn.parentElement.style.display = "none";
          }
        }
        verifiedGrid.style.display = "none";
        clearVerifiedSelection();

        if (newsSidebar) newsSidebar.style.display = "";
        checkMobile();

        pageTitle.innerText = currentSource ? currentSource.name : "Chọn nguồn deal";
        if (currentSource) {
          loadDeals(false);
        } else {
          dealsGrid.innerHTML = '<p class="empty-deals">Vui lòng chọn nguồn deal ở danh sách bên trái để bắt đầu.</p>';
        }
      } else {
        tabDeals.classList.remove("active");
        tabVerified.classList.add("active");

        dealsGrid.style.display = "none";
        pagination.style.display = "none";
        if (loadmoreBtn && loadmoreBtn.parentElement) {
          loadmoreBtn.parentElement.style.display = "none";
        }
        verifiedGrid.style.display = "grid";

        if (newsSidebar) newsSidebar.style.display = "none";
        if (menuBtn) menuBtn.style.display = "none";

        pageTitle.innerText = "Ứng dụng đã Verified";
        loadVerifiedApps();
      }
    }

          const selectCb = card.querySelector('.verified-select-checkbox');
          if (selectCb) {
            selectCb.addEventListener('change', (e) => {
              toggleVerifiedSelect(app.id, e.target.checked);
            });
          }

          verifiedAppsData.push(app);
          grid.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<p class="empty-deals">Không tải được danh sách verified. Vui lòng kiểm tra lại kết nối mạng.</p>';
        loading?.classList.remove("show");
      }
    }

    // ===== Chọn app verified -> tạo bài tổng hợp (iOS/Android converter) hoặc viết deal riêng (gendeal) =====
    function updateVerifiedBar() {
      const bar = document.getElementById("verifiedBar");
      const text = document.getElementById("verifiedBarText");
      const btnSingle = document.getElementById("btnWriteSingleDeal");
      if (!bar || !text) return;

      const n = selectedVerifiedIds.size;
      if (n > 0) {
        bar.classList.add("show");
        text.innerHTML = `Đã chọn <strong>${n}</strong> app`;
      } else {
        bar.classList.remove("show");
      }
      if (btnSingle) {
        btnSingle.disabled = n !== 1;
        btnSingle.title = n === 1 ? "" : "Chỉ chọn đúng 1 app để dùng nút này";
      }
    }

    function toggleVerifiedSelect(id, checked) {
      if (checked) selectedVerifiedIds.add(id);
      else selectedVerifiedIds.delete(id);
      updateVerifiedBar();
    }

    function clearVerifiedSelection() {
      selectedVerifiedIds.clear();
      document.querySelectorAll(".verified-select-checkbox").forEach((cb) => (cb.checked = false));
      updateVerifiedBar();
    }

    function cleanPriceValue(price) {
      if (price == null) return "";
      return String(price).replace(/^\$/, "").trim();
    }

    function extractCodeFromRedeemUrl(url) {
      if (!url) return "";
      const m = url.match(/[?&]code=([^&]+)/i);
      return m ? decodeURIComponent(m[1]) : "";
    }

    function goToConverterFromVerified() {
      const target = document.getElementById("verifiedTargetPlatform").value; // "ios" | "android"
      const selected = verifiedAppsData.filter((a) => selectedVerifiedIds.has(a.id));
      const matched = selected.filter((a) => a.platform === target && a.app_store_url);
      const skipped = selected.length - matched.length;

      if (!matched.length) {
        alert(`Không có app nào khớp nền tảng ${target === "ios" ? "iOS" : "Android"} trong lựa chọn (hoặc thiếu link).`);
        return;
      }
      if (skipped > 0) {
        const ok = confirm(`${skipped} app không khớp nền tảng ${target === "ios" ? "iOS" : "Android"} hoặc thiếu link sẽ bị bỏ qua. Tiếp tục với ${matched.length} app còn lại?`);
        if (!ok) return;
      }

      const prefill = matched.map((a) => ({
        url: a.app_store_url,
        price: cleanPriceValue(a.original_price),
        code: extractCodeFromRedeemUrl(a.redeem_url),
        lifetime: a.deal_type === "2" || a.deal_type === "3",
      }));

      const key = target === "ios" ? "techrum_ios_prefill" : "techrum_android_prefill";
      sessionStorage.setItem(key, JSON.stringify(prefill));
      window.location.href = target === "ios" ? "/news/ios.html" : "/news/android.html";
    }

    function goToGendealFromVerified() {
      if (selectedVerifiedIds.size !== 1) {
        alert("Chỉ chọn đúng 1 app để dùng nút này.");
        return;
      }
      const id = [...selectedVerifiedIds][0];
      const app = verifiedAppsData.find((a) => a.id === id);
      if (!app) return;

      const priceNote = app.original_price ? `Giá gốc: $${cleanPriceValue(app.original_price)}. ` : "";
      const typeNote = app.deal_type === "2" || app.deal_type === "3"
        ? "Đang miễn phí bản Lifetime/IAP. "
        : "Đang miễn phí tải app. ";
      const content = (priceNote + typeNote + (app.description || "")).trim();

      const prefill = {
        appName: app.app_name || "",
        content,
        link: app.app_store_url || "",
        redeemUrl: app.redeem_url || "",
        length: "long",
      };
      sessionStorage.setItem("techrum_gendeal_prefill", JSON.stringify(prefill));
      window.location.href = "/tools/gendeal.html";
    }

    function toggleDescription(btn) {
      const p = btn.previousElementSibling;
      if (p.classList.contains("truncated")) {
        p.classList.remove("truncated");
        btn.textContent = "Thu gọn";
      } else {
        p.classList.add("truncated");
        btn.textContent = "Xem thêm";
      }
    }

    async function deleteVerifiedApp(id, name) {
      if (!confirm(`Bạn có chắc chắn muốn xoá ứng dụng "${name}" khỏi danh sách verified?`)) {
        return;
      }
      try {
        const res = await fetch(`${DEALS_BASE_API}/api/verified-apps/delete?id=${id}`);
        const data = await res.json();
        if (data && data.deleted) {
          loadVerifiedApps();
        } else {
          alert("Có lỗi xảy ra khi xoá ứng dụng.");
        }
      } catch (e) {
        console.error(e);
        alert("Không thể kết nối đến server để xoá ứng dụng.");
      }
    }

    async function init() {
      loadSources();
      updateCartBar();
    }

    init();

    const menuBtn = document.getElementById("menuBtn");
    menuBtn.addEventListener("click", () => {
      document.getElementById("newsSidebar").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("show");
    });

    function checkMobile() {
      if (activeTab !== 'deals') {
        if (menuBtn) menuBtn.style.display = "none";
        return;
      }
      if (window.innerWidth <= 768) {
        menuBtn.style.display = "inline-block";
      } else {
        menuBtn.style.display = "none";
        document.getElementById("newsSidebar").classList.remove("open");
      }
    }
    window.addEventListener("resize", checkMobile);
    checkMobile();

    function bindTheme(btn) {
      if (!btn) return;
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        const icon = isDark ? "☀️" : "🌙";
        document.getElementById("themeToggle").textContent = icon;
        const m = document.getElementById("themeToggleMobile");
        if (m) m.textContent = isDark ? "☀️ Sáng" : "🌙 Dark mode";
      });
    }

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      const t = document.getElementById("themeToggle");
      if (t) t.textContent = "☀️";
      const m = document.getElementById("themeToggleMobile");
      if (m) m.textContent = "☀️ Sáng";
    }
    bindTheme(document.getElementById("themeToggle"));
    bindTheme(document.getElementById("themeToggleMobile"));
  </script>
</body>
